<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+U:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="components/header.js" type="text/javascript" defer></script>
    <script src="components/footer.js" type="text/javascript" defer></script>
    <title>Steve Dixon</title>
  </head>
  <style>
    .contact-section {
      max-width: 70%;
      margin: auto;
      filter: drop-shadow(0 0 0.25rem black);
      background-color: #fff0ce;
      padding: 0.5rem;
    }
    .contact-section form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .contact-section input {
      height: 2rem;
    }

    .contact-section textarea {
      height: 5rem;
    }
    .contact-section button {
      height: 3rem;
      background-color: #ff0000;
      color: white;
      font-size: 1.5rem;
      align-self: flex-start;
      border: none;
      filter: drop-shadow(0 0 0.25rem black);
      width: 20%;
    }

    .contact-section button:hover {
      background-color: #a61212;
      cursor: pointer;
    }

    .contact-section h1 {
      margin-top: 0;
    }
  </style>
  <body>
    <header-component></header-component>
    <main>
      <div class="contact-section">
        <h1>Contact Me</h1>
        <p>Reach out anytime.</p>
        <form action="https://api.web3forms.com/submit" method="POST">
          <input
            type="hidden"
            name="access_key"
            value="ff2a97ac-c5fb-4eb0-ba48-c506958053b3"
          />
          <input type="text" name="name" placeholder="Name" required />
          <input type="email" name="email" placeholder="Email" required />
          <textarea name="message" placeholder="Message" required></textarea>
          <button type="submit">Submit</button>
        </form>
      </div>
    </main>
    <footer-component></footer-component>
  </body>
</html>
