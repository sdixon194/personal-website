<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+U:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="components/header.js" type="text/javascript" defer></script>
    <script src="components/footer.js" type="text/javascript" defer></script>
    <title>Steve Dixon</title>
    <link rel="icon" type="image/jpg" href="/favicon.ico" />
  </head>
  <style>
    .random-photo img {
      filter: drop-shadow(0 0 0.25rem black);
    }
    .random-photo figcaption {
      font-style: italic;
      text-align: center;
    }

    .random-photo figure {
      margin: 0;
    }

    .random-button {
      border: none;
      filter: drop-shadow(0 0 0.25rem black);
      background-color: #9ca6ab;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 0.5rem;
      padding: 0.25rem;
    }
  </style>
  <body>
    <header-component></header-component>
    <main>
      <div class="home-section">
        <p>Hey, my name is Steve and this is my place on the internet.</p>
        <div class="random-photo" id="random-photo"></div>
      </div>
      <button
        class="random-button"
        id="random-photo-button"
        onClick="getRandomPhoto()"
      >
        Roll a random photo
      </button>
    </main>
    <footer-component></footer-component>
  </body>
  <script>
    function getRandomPhoto() {
      const photoArray = [
        {
          path: "cardinal.jpg",
          alt: "A bright red male cardinal in the white snow",
          caption: "Crest",
        },
        {
          path: "grackles.jpg",
          alt: "A handful of grackles in a leafless tree ",
          caption: "Scheming",
        },
        {
          path: "starlings.jpg",
          alt: "Starlings in a tree",
          caption: "Winter",
        },
        {
          path: "taipei-alley.jpg",
          alt: "A rainy alley in Jiufen, Taiwan with umbrellas and street vendors below and industrial air conditioning and buildings above",
          caption: "Jiufen, Taiwan",
        },
        {
          path: "taipei-lanterns.jpg",
          alt: "Bright red Chinese lanterns against a dark blue sky.",
          caption: "Lanterns in Jiufen",
        },
        {
          path: "titmouse.jpg",
          alt: "A round titmouse holding a seed on a tree branch in the winter looking directly at the camera",
          caption: "Looking back at me",
        },
        {
          path: "ireland1.jpg",
          alt: "A photo of a blue pond in the middle of misty and rainy woods in Ireland",
          caption: "Lady of the Lake",
        },
        {
          path: "lakeside.jpg",
          alt: "A photo of a lake with mountains in the distance, it's grey and overcast",
          caption: "Lakeside",
        },
        {
          path: "ireland-country.jpg",
          alt: "The sprawling green irish countryside with hills and a ruined castle",
          caption: "Countryside",
        },
        {
          path: "aran-island-1.jpg",
          alt: "Cliffs on the side of the Aran islands, the sky is grey and there's a small group of houses in the distance.",
          caption: "Inishmore",
        },
        {
          path: "ireland-bird.jpg",
          alt: "A small brown bird in the brush of the Irish seaside with the grey waves behind in the distance",
          caption: "Seabird",
        },
      ];
      const photoElement = document.getElementById("random-photo");
      while (photoElement.firstChild) {
        photoElement.removeChild(photoElement.firstChild);
      }
      const randomPhoto =
        photoArray[Math.floor(Math.random() * photoArray.length)];
      const figure = document.createElement("figure");
      const image = document.createElement("img");
      image.setAttribute("src", `/photos/${randomPhoto.path}`);
      image.setAttribute("width", "100%");
      image.setAttribute("alt", randomPhoto.alt);
      const figcaption = document.createElement("figcaption");
      figcaption.innerHTML = randomPhoto.caption;
      figure.appendChild(image);
      figure.appendChild(figcaption);
      photoElement.appendChild(figure);
    }
    getRandomPhoto();
  </script>
</html>
